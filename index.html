<script>
/* ===== Your own audio files =====
   resources/song.mp3  -> background song (🎵 button / Settings > Music / Celebrate)
   resources/byme.mp3  -> your voice note (menu > 🎙️ Voice Note)
   If a file is missing, the site keeps working: the song falls back to the built-in
   Happy Birthday tune, and the Voice Note menu item stays hidden. */
(function(){
const SONG_SRC='resources/song.mp3',VOICE_SRC='resources/byme.mp3';
const song=new Audio(SONG_SRC);song.loop=true;song.preload='auto';
const voice=new Audio(VOICE_SRC);voice.preload='metadata';
let useSong=false,voiceOK=false;
const clamp=v=>Math.min(1,Math.max(0,v));
const songVol=()=>{song.volume=clamp(mv*((voice.paused&&!window.HDuck)?1:.2))};   // song softens while the voice note plays
const synthMusic=music,baseAps=aps;
music=function(on){
  if(!on){if(useSong){useSong=false;song.pause()}return synthMusic(false)}
  if(song.error)return synthMusic(true);
  songVol();useSong=true;mp=true;mst=true;$('mu').style.opacity=1;
  const p=song.play();
  if(p&&p.catch)p.catch(e=>{useSong=false;if(e&&e.name==='NotAllowedError'){mp=false;$('mu').style.opacity=.45}else synthMusic(true)});
};
aps=function(){baseAps();songVol()};
song.addEventListener('error',()=>{if(useSong){useSong=false;mp=false;synthMusic(true)}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(useSong)song.pause();if(!voice.paused)voice.pause()}
  else if(useSong&&mp)song.play().catch(()=>{});
});

window.HSong={song,voice,using:()=>useSong,
  autoStart(){if(song.error)return;songVol();const p=song.play();if(p&&p.then)p.then(()=>{if(song.error)return;useSong=true;mp=true;mst=true;$('mu').style.opacity=1;S2.music=true;sv()}).catch(()=>{})}};

/* Voice note screen */
const vn=mk('vn','<div style="text-align:center;max-width:84vw"><div class="vin" id="vnd">🎙️</div><div style="font:40px \'Great Vibes\',cursive;color:var(--acc)">A voice note for you</div><p style="font-size:13px;opacity:.8;margin:4px 0 14px">Put on your headphones 🎧</p><div class="sr" style="gap:10px;width:min(82vw,320px);margin:0 auto"><button id="vnp" aria-label="Play or pause" style="min-width:44px">▶</button><input type="range" id="vnr" min="0" max="1000" value="0" aria-label="Seek" style="flex:1;width:auto"><span id="vnt" style="font-size:12px;opacity:.8;min-width:36px;text-align:right">0:00</span></div></div>');
const vnp=$('vnp'),vnr=$('vnr'),vnt=$('vnt'),vnd=$('vnd');
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ui=()=>{const pl=!voice.paused;vnp.textContent=pl?'⏸':'▶';vnd.classList.toggle('spin',pl);songVol()};
vnp.onclick=()=>{if(voice.paused)voice.play().catch(()=>tst('Could not play the voice note'));else voice.pause()};
vnr.addEventListener('input',()=>{if(voice.duration)voice.currentTime=vnr.value/1000*voice.duration});
voice.addEventListener('timeupdate',()=>{if(voice.duration)vnr.value=voice.currentTime/voice.duration*1000;vnt.textContent=fmt(voice.currentTime)+' / '+fmt(voice.duration)});
['play','pause','ended'].forEach(e=>voice.addEventListener(e,ui));
voice.addEventListener('ended',()=>{voice.currentTime=0;vnr.value=0});
new MutationObserver(()=>{if(!vn.classList.contains('on')&&!voice.paused)voice.pause()}).observe(vn,{attributes:true,attributeFilter:['class']});

/* Show the menu item only when byme.mp3 really exists */
function addNav(){
  if(NAV.some(n=>n[0]=='voice'))return;
  NAV.splice(NAV.findIndex(n=>n[0]=='surprise'),0,['voice','🎙️','Voice Note']);
  $('dl').innerHTML=NAV.map(n=>`<button class="ni" data-p="${n[0]}"><span>${n[1]}</span>${n[2]}</button>${n[0]=='surprise'?'<hr>':''}`).join('');
  RT.voice=()=>{vnt.textContent='0:00 / '+fmt(voice.duration);opn('vn')};MAP.vn='voice';
  const a='Voice Note'.split('|');a.forEach(y=>LTM[y]=a);setLang();
}
voice.addEventListener('loadedmetadata',()=>{if(!voiceOK){voiceOK=true;addNav()}});
})();
</script>
